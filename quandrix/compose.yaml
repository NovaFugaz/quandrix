    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/quandrix_transactions?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=quandrix
      - SPRING_DATASOURCE_PASSWORD=quandrix123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - JAVA_OPTS=-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50

  ms-reviews:
    build: ./ms-reviews
    container_name: quandrix-reviews
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8087:8087"
    depends_on:
      eureka-server:
