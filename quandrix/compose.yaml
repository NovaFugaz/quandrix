services:
  mysql:
    image: mysql:8.0
    container_name: quandrix-mysql
    mem_limit: 1g
    cpus: 1
    environment:
      MYSQL_ROOT_PASSWORD: quandrix123
      MYSQL_USER: quandrix
      MYSQL_PASSWORD: quandrix123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pquandrix123"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./eureka-server
    container_name: quandrix-eureka
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "8761:8761"
    environment:
      - SPRING_APPLICATION_NAME=eureka-server
      - JAVA_OPTS=-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50

  api-gateway:
    build: ./api-gateway
    container_name: quandrix-gateway
    mem_limit: 384m
    cpus: 0.5
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - JAVA_OPTS=-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=60

  ms-auth:
    build: ./ms-auth
    container_name: quandrix-auth
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/quandrix_auth?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=quandrix
      - SPRING_DATASOURCE_PASSWORD=quandrix123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - JWT_SECRET=d8JAM72TEgISjAePoNlVVLzhjr3JcqjwRxBebr6Ktk8
      - JWT_EXPIRATION=86400000
      - JAVA_OPTS=-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50

  ms-users:
    build: ./ms-users
    container_name: quandrix-users
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/quandrix_users?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=quandrix
      - SPRING_DATASOURCE_PASSWORD=quandrix123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - JAVA_OPTS=-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50

  ms-catalog:
    build: ./ms-catalog
    container_name: quandrix-catalog
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/quandrix_catalog?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=quandrix
      - SPRING_DATASOURCE_PASSWORD=quandrix123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - JAVA_OPTS=-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50

  ms-listings:
    build: ./ms-listings
    container_name: quandrix-listings
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_started
      ms-catalog:
        condition: service_started
      ms-users:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/quandrix_listings?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=quandrix
      - SPRING_DATASOURCE_PASSWORD=quandrix123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - JAVA_OPTS=-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50

  ms-payments:
    build: ./ms-payments
    container_name: quandrix-payments
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8086:8086"
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/quandrix_payments?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=quandrix
      - SPRING_DATASOURCE_PASSWORD=quandrix123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - JAVA_OPTS=-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50

  ms-orders:
